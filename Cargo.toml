[package]
name = "hx"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
futures = "0.3.34"
grep = "0.4.1"
hmac = "0.13.0"
ignore = "0.4.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
landlock = "0.4.7"
libc = "0.2.191"
memchr = "2.8.3"
mlua = { version = "0.12.2", features = ["luau", "async", "serialize", "send"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
